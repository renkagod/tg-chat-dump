[project]
name = "tg-chat-dump"
version = "1.0.0"
description = "Dump a whole Telegram chat, forum topics included, into SQLite and per-topic folders"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.40",
    "python-dotenv>=1.0",
    "python-socks[asyncio]>=2.4",
    "prompt-toolkit>=3.0.53",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP031"]
